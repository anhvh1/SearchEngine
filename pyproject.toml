[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "milestone-search-engine"
version = "0.1.0"
description = "Profile-driven event and alarm search for Milestone"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.18", "psycopg[binary]>=3.2,<4", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
voice = ["faster-whisper>=1.1,<2"]
build = ["pyinstaller>=6.10,<7", "pywin32>=306"]

[project.scripts]
milestone-search = "search_engine.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
